<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ЗахаркаГрам</title>
<link rel="manifest" href="/manifest.json">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root, body[data-theme="dark"] {
    --bg: #17212b; --bg-panel: #0e1621; --bg-chat: #0e1621;
    --bg-input: #17212b; --bg-msg-in: #182533; --bg-msg-out: #2b5278;
    --accent: #5288c1; --accent-hover: #6ba3e0;
    --text: #ffffff; --text-dim: #708499; --border: #101921;
    --online: #4dcd5e; --danger: #e53935;
    --hover: rgba(255,255,255,.05); --hover-soft: rgba(255,255,255,.04);
    --scroll-thumb: rgba(255,255,255,.12); --scroll-thumb-hover: rgba(255,255,255,.2);
    --bg-login: radial-gradient(circle at 50% 30%, #1c2a3a 0%, #0e1621 70%);
    --toggle-off: #2a3947; --card-shadow: rgba(0,0,0,.4);
  }
  body[data-theme="light"] {
    --bg: #ffffff; --bg-panel: #f4f4f5; --bg-chat: #e6ebee;
    --bg-input: #f1f3f5; --bg-msg-in: #ffffff; --bg-msg-out: #eeffde;
    --accent: #3390ec; --accent-hover: #4aa3f0;
    --text: #000000; --text-dim: #707579; --border: #e4e7eb;
    --online: #4dcd5e; --danger: #e53935;
    --hover: rgba(0,0,0,.05); --hover-soft: rgba(0,0,0,.03);
    --scroll-thumb: rgba(0,0,0,.15); --scroll-thumb-hover: rgba(0,0,0,.25);
    --bg-login: radial-gradient(circle at 50% 30%, #e8f0f8 0%, #f4f4f5 70%);
    --toggle-off: #d0d5db; --card-shadow: rgba(0,0,0,.12);
  }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); overflow: hidden; font-size: 15px;
    transition: background .2s, color .2s;
  }

  .screen { display: none; height: 100vh; height: 100dvh; }
  .screen.active { display: flex; }

  /* LOGIN */
  #login {
    flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; background: var(--bg-login); overflow-y: auto;
  }
  .logo {
    width: 100px; height: 100px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #2b5278);
    display: flex; align-items: center; justify-content: center;
    font-size: 48px; font-weight: 700; color: #fff;
    margin-bottom: 20px;
    box-shadow: 0 10px 40px rgba(82,136,193,.35);
  }
  #login h1 { font-size: 26px; font-weight: 600; margin-bottom: 24px; }
  .auth-card {
    width: 100%; max-width: 380px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 16px; padding: 24px;
    box-shadow: 0 20px 60px var(--card-shadow);
  }
  .auth-tabs {
    display: flex; gap: 4px; background: var(--bg-input);
    padding: 4px; border-radius: 10px; margin-bottom: 18px;
  }
  .auth-tab {
    flex: 1; padding: 9px; border-radius: 7px;
    text-align: center; font-size: 14px; font-weight: 500;
    cursor: pointer; color: var(--text-dim);
    transition: background .15s, color .15s;
  }
  .auth-tab.active { background: var(--bg); color: var(--text); }
  body[data-theme="dark"] .auth-tab.active { background: var(--bg-panel); }
  .auth-form { display: none; }
  .auth-form.active { display: block; }

  .field { margin-bottom: 14px; }
  .field label {
    display: block; font-size: 13px; color: var(--text-dim);
    margin-bottom: 6px; font-weight: 500;
  }
  .field label .opt { color: var(--text-dim); opacity: .7; font-weight: 400; }
  .field input, .field textarea {
    width: 100%; background: var(--bg-input);
    border: 1px solid transparent; border-radius: 10px;
    padding: 12px 14px; color: var(--text);
    font-size: 15px; font-family: inherit; outline: none;
    transition: border-color .15s, background .15s; resize: none;
  }
  .field input:focus, .field textarea:focus { border-color: var(--accent); background: var(--bg-panel); }
  .field input::placeholder, .field textarea::placeholder { color: var(--text-dim); opacity: .8; }
  .field input.invalid { border-color: var(--danger); }
  .field .hint { font-size: 12px; color: var(--text-dim); margin-top: 6px; min-height: 16px; }
  .field .hint.error { color: var(--danger); }
  .username-prefix { position: relative; }
  .username-prefix::before {
    content: '@'; position: absolute; left: 14px; top: 50%;
    transform: translateY(-50%); color: var(--text-dim);
    font-size: 15px; pointer-events: none;
  }
  .username-prefix input { padding-left: 30px; }

  .btn-primary {
    width: 100%; background: var(--accent); color: #fff;
    border: none; border-radius: 10px; padding: 13px;
    font-size: 16px; font-weight: 500; cursor: pointer;
    margin-top: 4px; transition: background .15s, transform .1s;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:active { transform: scale(.98); }
  .btn-primary:disabled { opacity: .6; cursor: not-allowed; }
  .auth-error {
    color: var(--danger); font-size: 13px;
    text-align: center; margin-top: 12px; min-height: 18px;
  }

  /* ONBOARDING (переиспользуем .auth-card) */
  #onboarding {
    flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; background: var(--bg-login); overflow-y: auto;
  }
  .onb-card {
    width: 100%; max-width: 420px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 16px;
    padding: 32px 28px; box-shadow: 0 20px 60px var(--card-shadow);
  }
  .onb-card h2 { font-size: 22px; font-weight: 600; margin-bottom: 6px; text-align: center; }
  .onb-card .sub { color: var(--text-dim); font-size: 14px; text-align: center; margin-bottom: 28px; }
  .char-count { text-align: right; font-size: 12px; color: var(--text-dim); margin-top: 4px; }

  /* APP */
  #app { flex-direction: column; }
  .app-body { flex: 1; display: flex; min-height: 0; position: relative; }
  .tab-content { display: none; flex: 1; min-height: 0; }
  .tab-content.active { display: flex; }

  #tabChats { flex-direction: row; }
  .sidebar {
    width: 380px; min-width: 380px; background: var(--bg);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
  }
  .sidebar-header {
    height: 56px; padding: 0 16px;
    display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid var(--border); background: var(--bg-panel);
  }
  .burger {
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--text-dim);
  }
  .burger:hover { background: var(--hover); color: var(--text); }
  .search-box {
    flex: 1; background: var(--bg-input); border-radius: 20px;
    padding: 8px 14px; color: var(--text-dim); font-size: 15px;
    display: flex; align-items: center; gap: 8px;
  }
  .search-box input {
    background: transparent; border: none; outline: none;
    color: var(--text); flex: 1; font-size: 15px;
  }
  .search-box input::placeholder { color: var(--text-dim); }

  .chat-list { flex: 1; overflow-y: auto; }
  .chat-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; cursor: pointer; transition: background .12s;
  }
  .chat-item:hover { background: var(--hover-soft); }
  .chat-item.active { background: var(--accent); }
  .chat-item.active .chat-preview, .chat-item.active .chat-time,
  .chat-item.active .chat-name, .chat-item.active .chat-username { color: #fff; }
  .avatar {
    width: 54px; height: 54px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 600; color: #fff;
    flex-shrink: 0; position: relative;
  }
  .avatar svg { display: block; }
  .chat-info { flex: 1; min-width: 0; }
  .chat-row1 {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 3px;
  }
  .chat-name { font-weight: 500; font-size: 16px; }
  .chat-time { font-size: 12px; color: var(--text-dim); }
  .chat-row2 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .chat-preview {
    font-size: 14px; color: var(--text-dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;
  }
  .chat-username { font-size: 13px; color: var(--accent); }
  .search-result-section {
    padding: 10px 16px 6px; font-size: 12px; color: var(--text-dim);
    font-weight: 600; text-transform: uppercase; letter-spacing: .5px;
  }

  .chat-view {
    flex: 1; display: flex; flex-direction: column;
    background: var(--bg-chat); position: relative; min-width: 0;
  }
  .chat-header {
    height: 56px; padding: 0 16px; display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid var(--border); background: var(--bg-panel); flex-shrink: 0;
  }
  .chat-header .avatar { width: 40px; height: 40px; font-size: 17px; }
  .chat-header-info { flex: 1; min-width: 0; }
  .chat-header-name { font-weight: 500; font-size: 16px; }
  .chat-header-status { font-size: 13px; color: var(--text-dim); }
  .back-btn {
    width: 40px; height: 40px; border-radius: 50%;
    display: none; align-items: center; justify-content: center;
    cursor: pointer; color: var(--text-dim);
  }
  .header-menu {
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--text-dim);
  }
  .header-menu:hover { background: var(--hover); color: var(--text); }

  .messages {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .msg {
    max-width: 65%; padding: 7px 12px 8px; border-radius: 12px;
    font-size: 15px; line-height: 1.35; word-wrap: break-word;
    align-self: flex-start; background: var(--bg-msg-in);
    position: relative; animation: msgIn .18s ease-out;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(6px) scale(.98); }
    to { opacity: 1; transform: none; }
  }
  .msg.out {
    align-self: flex-end; background: var(--bg-msg-out);
    border-bottom-right-radius: 4px;
  }
  body[data-theme="light"] .msg.out { color: #000; }
  .msg.in { border-bottom-left-radius: 4px; }
  .msg .author { font-size: 13px; font-weight: 600; color: var(--accent); margin-bottom: 2px; }
  .msg .meta {
    font-size: 11px; color: var(--text-dim);
    float: right; margin: 4px 0 -2px 8px; opacity: .8;
  }
  body[data-theme="light"] .msg.out .meta { color: rgba(0,0,0,.45); }

  .composer {
    padding: 8px 12px; display: flex; align-items: flex-end; gap: 8px;
    background: var(--bg-panel); border-top: 1px solid var(--border); flex-shrink: 0;
  }
  .composer-input-wrap {
    flex: 1; background: var(--bg-input); border-radius: 20px;
    display: flex; align-items: flex-end; padding: 6px 6px 6px 16px;
  }
  .composer textarea {
    flex: 1; resize: none; border: none; outline: none;
    background: transparent; color: var(--text);
    font-size: 15px; line-height: 22px; max-height: 120px;
    font-family: inherit; padding: 4px 0;
  }
  .composer textarea::placeholder { color: var(--text-dim); }
  .send-btn {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--accent); color: #fff; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    transition: background .15s, transform .1s;
  }
  .send-btn:hover { background: var(--accent-hover); }
  .send-btn:active { transform: scale(.92); }

  .empty-state {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: var(--text-dim); font-size: 14px; text-align: center; padding: 24px;
  }

  #tabSettings, #tabProfile {
    flex-direction: column; overflow-y: auto; background: var(--bg-chat);
  }
  .page-header {
    height: 56px; padding: 0 20px; display: flex; align-items: center;
    border-bottom: 1px solid var(--border); background: var(--bg-panel);
    font-size: 17px; font-weight: 600; flex-shrink: 0;
  }
  .page-body { padding: 20px; max-width: 640px; width: 100%; }

  .settings-group {
    background: var(--bg); border-radius: 12px; overflow: hidden;
    margin-bottom: 16px; border: 1px solid var(--border);
  }
  .settings-item {
    display: flex; align-items: center; gap: 14px; padding: 14px 16px;
    cursor: pointer; transition: background .12s;
    border-bottom: 1px solid var(--border);
  }
  .settings-item:last-child { border-bottom: none; }
  .settings-item:hover { background: var(--hover-soft); }
  .settings-item .icon {
    width: 28px; height: 28px; display: flex; align-items: center;
    justify-content: center; color: var(--accent); flex-shrink: 0;
  }
  .settings-item .icon.dim { color: var(--text-dim); }
  .settings-item .label { flex: 1; font-size: 15px; }
  .settings-item .value { font-size: 14px; color: var(--text-dim); margin-right: 4px; }

  .toggle {
    width: 44px; height: 26px; background: var(--toggle-off);
    border-radius: 13px; position: relative; flex-shrink: 0; transition: background .2s;
  }
  .toggle::after {
    content: ''; position: absolute; top: 3px; left: 3px;
    width: 20px; height: 20px; border-radius: 50%;
    background: #fff; transition: transform .2s;
    box-shadow: 0 1px 3px rgba(0,0,0,.3);
  }
  .toggle.on { background: var(--accent); }
  .toggle.on::after { transform: translateX(18px); }

  .profile-card {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 16px; padding: 28px;
    display: flex; flex-direction: column; align-items: center;
    text-align: center; margin-bottom: 20px;
  }
  .profile-avatar {
    width: 96px; height: 96px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #2b5278);
    display: flex; align-items: center; justify-content: center;
    font-size: 40px; font-weight: 600; color: #fff; margin-bottom: 16px;
    box-shadow: 0 8px 30px rgba(82,136,193,.35);
  }
  .profile-name { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
  .profile-username { font-size: 15px; color: var(--accent); margin-bottom: 16px; }
  .profile-bio {
    font-size: 15px; color: var(--text-dim); max-width: 360px;
    line-height: 1.45; white-space: pre-wrap; word-wrap: break-word;
  }
  .profile-bio.empty { font-style: italic; opacity: .6; }

  .bottom-nav {
    height: 60px; display: flex; background: var(--bg-panel);
    border-top: 1px solid var(--border); flex-shrink: 0;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .nav-item {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 3px; cursor: pointer;
    color: var(--text-dim); font-size: 11px; font-weight: 500;
    transition: color .15s; user-select: none; position: relative;
  }
  .nav-item svg { width: 24px; height: 24px; }
  .nav-item:hover { color: var(--text); }
  .nav-item.active { color: var(--accent); }
  .nav-item.active::after {
    content: ''; position: absolute; top: 0;
    width: 32px; height: 2px; background: var(--accent);
    border-radius: 0 0 2px 2px;
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--scroll-thumb-hover); }

  @media (max-width: 760px) {
    .sidebar { width: 100%; min-width: 0; }
    #app.chat-open #sidebar { display: none; }
    #app.chat-open .chat-view { display: flex; }
    #app:not(.chat-open) .chat-view { display: none; }
    .back-btn { display: flex; }
    .msg { max-width: 80%; }
  }
</style>
</head>
<body data-theme="dark">

<!-- LOGIN -->
<div id="login" class="screen active">
  <div class="logo">З</div>
  <h1>ЗахаркаГрам</h1>
  <div class="auth-card">
    <div class="auth-tabs">
      <div class="auth-tab active" data-mode="login">Вход</div>
      <div class="auth-tab" data-mode="register">Регистрация</div>
    </div>

    <!-- Вход -->
    <div class="auth-form active" id="formLogin">
      <div class="field">
        <label>Юзернейм</label>
        <div class="username-prefix">
          <input type="text" id="loginUsername" placeholder="username" autocomplete="username" maxlength="32">
        </div>
      </div>
      <div class="field">
        <label>Пароль</label>
        <input type="password" id="loginPassword" placeholder="••••••" autocomplete="current-password">
      </div>
      <button class="btn-primary" id="loginBtn">Войти</button>
      <div class="auth-error" id="loginError"></div>
    </div>

    <!-- Регистрация -->
    <div class="auth-form" id="formRegister">
      <div class="field">
        <label>Юзернейм</label>
        <div class="username-prefix">
          <input type="text" id="regUsername" placeholder="username" autocomplete="username" maxlength="32">
        </div>
        <div class="hint" id="regUsernameHint">Латиница, цифры, _, от 5 до 32 символов</div>
      </div>
      <div class="field">
        <label>Пароль</label>
        <input type="password" id="regPassword" placeholder="Минимум 6 символов" autocomplete="new-password">
      </div>
      <div class="field">
        <label>Повтори пароль</label>
        <input type="password" id="regPassword2" placeholder="Ещё раз" autocomplete="new-password">
      </div>
      <button class="btn-primary" id="registerBtn">Создать аккаунт</button>
      <div class="auth-error" id="registerError"></div>
    </div>
  </div>
</div>

<!-- ONBOARDING -->
<div id="onboarding" class="screen">
  <div class="onb-card">
    <h2>Настройка профиля</h2>
    <div class="sub">Как тебя будут видеть другие</div>

    <div class="field">
      <label>Псевдоним</label>
      <input type="text" id="onbName" placeholder="Как тебя звать?" maxlength="32" autocomplete="off">
      <div class="hint" id="onbNameHint"></div>
    </div>

    <div class="field">
      <label>Описание профиля <span class="opt">(по желанию)</span></label>
      <textarea id="onbBio" rows="3" placeholder="Пара слов о себе..." maxlength="120"></textarea>
      <div class="char-count" id="onbBioCount">0 / 120</div>
    </div>

    <button class="btn-primary" id="onbSubmit">Продолжить</button>
    <div class="auth-error" id="onbError"></div>
  </div>
</div>

<!-- APP -->
<div id="app" class="screen">
  <div class="app-body">
    <div class="tab-content active" id="tabChats">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="burger">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
          </div>
          <div class="search-box">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <input type="text" id="searchInput" placeholder="Поиск">
          </div>
        </div>
        <div class="chat-list" id="chatList"></div>
      </aside>

      <section class="chat-view" id="chatView">
        <div class="empty-state" id="emptyState">Выберите чат, чтобы начать общение</div>

        <div id="chatContent" style="display:none; flex:1; flex-direction:column; min-height:0;">
          <div class="chat-header">
            <div class="back-btn" id="backBtn">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            </div>
            <div class="avatar" id="chatHeaderAvatar"></div>
            <div class="chat-header-info">
              <div class="chat-header-name" id="chatHeaderName"></div>
              <div class="chat-header-status" id="chatHeaderStatus"></div>
            </div>
          </div>

          <div class="messages" id="messages"></div>

          <div class="composer">
            <div class="composer-input-wrap">
              <textarea id="msgInput" rows="1" placeholder="Написать сообщение..."></textarea>
            </div>
            <button class="send-btn" id="sendBtn">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
          </div>
        </div>
      </section>
    </div>

    <div class="tab-content" id="tabSettings">
      <div class="page-header">Настройки</div>
      <div class="page-body">
        <div class="settings-group">
          <div class="settings-item" id="themeItem">
            <div class="icon" id="themeIcon"></div>
            <div class="label">Тема</div>
            <div class="value" id="themeValue">Тёмная</div>
          </div>
          <div class="settings-item" id="notifItem">
            <div class="icon dim">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            </div>
            <div class="label">Уведомления</div>
            <div class="toggle" id="notifToggle"></div>
          </div>
          <div class="settings-item" id="langItem">
            <div class="icon dim">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
            </div>
            <div class="label">Язык</div>
            <div class="value" id="langValue">Русский</div>
          </div>
          <div class="settings-item" id="premiumItem">
            <div class="icon">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.26 6.6.72-4.9 4.55 1.32 6.52L12 16.77 6.08 20.05l1.32-6.52-4.9-4.55 6.6-.72L12 2z"/></svg>
            </div>
            <div class="label">ЗахаркаГрам Премиум</div>
            <div class="value">→</div>
          </div>
          <div class="settings-item" id="logoutItem">
            <div class="icon" style="color:var(--danger)">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            </div>
            <div class="label" style="color:var(--danger)">Выйти</div>
          </div>
        </div>
      </div>
    </div>

    <div class="tab-content" id="tabProfile">
      <div class="page-header">Профиль</div>
      <div class="page-body">
        <div class="profile-card">
          <div class="profile-avatar" id="profileAvatar">?</div>
          <div class="profile-name" id="profileName">—</div>
          <div class="profile-username" id="profileUsername">@—</div>
          <div class="profile-bio" id="profileBio"></div>
        </div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <div class="nav-item active" data-tab="chats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span>Чаты</span>
    </div>
    <div class="nav-item" data-tab="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span>Настройки</span>
    </div>
    <div class="nav-item" data-tab="profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>Профиль</span>
    </div>
  </nav>
</div>

<script>
const state = {
  me: null, token: null, chats: [], users: [],
  activeChatId: null, currentTab: 'chats', ws: null,
};

let theme = localStorage.getItem('zkg_theme') || 'dark';
let notificationsOn = localStorage.getItem('zkg_notif') === '1';

const API = window.location.origin.startsWith('http') ? window.location.origin : 'http://localhost:3000';
const WS_URL = API.replace(/^http/, 'ws') + '/ws';
const $ = (id) => document.getElementById(id);
const STAR_SVG = `<svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M12 2l2.9 6.26 6.6.72-4.9 4.55 1.32 6.52L12 16.77 6.08 20.05l1.32-6.52-4.9-4.55 6.6-.72L12 2z"/></svg>`;

const escapeHtml = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const formatTime = (ts) => { const d = new Date(ts); return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0'); };
const initials = (n) => (n || '?').trim().charAt(0).toUpperCase();

// ==== ТЕМА ====
function applyTheme() {
  document.body.dataset.theme = theme;
  $('themeValue').textContent = theme === 'dark' ? 'Тёмная' : 'Светлая';
  $('themeIcon').innerHTML = theme === 'dark'
    ? `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`
    : `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>`;
}
applyTheme();
$('themeItem').addEventListener('click', () => {
  theme = theme === 'dark' ? 'light' : 'dark';
  localStorage.setItem('zkg_theme', theme);
  applyTheme();
});
function applyNotif() { $('notifToggle').classList.toggle('on', notificationsOn); }
applyNotif();
$('notifItem').addEventListener('click', () => {
  notificationsOn = !notificationsOn;
  localStorage.setItem('zkg_notif', notificationsOn ? '1' : '0');
  applyNotif();
});

// ==== API ====
async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
  const res = await fetch(API + path, { ...opts, headers });
  if (!res.ok) {
    let err = {}; try { err = await res.json(); } catch {}
    throw new Error(err.error || ('http ' + res.status));
  }
  return res.json();
}

// ==== ВКЛАДКИ ЛОГИНА ====
document.querySelectorAll('.auth-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    const mode = tab.dataset.mode;
    document.querySelectorAll('.auth-tab').forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
    $('formLogin').classList.toggle('active', mode === 'login');
    $('formRegister').classList.toggle('active', mode === 'register');
    $('loginError').textContent = '';
    $('registerError').textContent = '';
  });
});

// ==== ВХОД ====
$('loginBtn').addEventListener('click', async () => {
  const username = $('loginUsername').value.trim();
  const password = $('loginPassword').value;
  $('loginError').textContent = '';
  if (!username || !password) { $('loginError').textContent = 'Заполни оба поля'; return; }

  const btn = $('loginBtn'); btn.disabled = true;
  try {
    const data = await api('/api/auth/login', { method: 'POST', body: JSON.stringify({ username, password }) });
    state.token = data.token;
    state.me = data.user;
    localStorage.setItem('zkg_token', data.token);

    if (data.isNewUser || !data.user.name) {
      $('login').classList.remove('active');
      $('onboarding').classList.add('active');
      setTimeout(() => $('onbName').focus(), 100);
    } else {
      $('login').classList.remove('active');
      await bootApp();
    }
  } catch (e) {
    $('loginError').textContent = e.message === 'invalid credentials'
      ? 'Неверный юзернейм или пароль'
      : e.message;
  } finally { btn.disabled = false; }
});

// ==== РЕГИСТРАЦИЯ ====
$('regUsername').addEventListener('input', () => {
  const v = $('regUsername').value.trim();
  const hint = $('regUsernameHint'), inp = $('regUsername');
  if (!v) { inp.classList.remove('invalid'); hint.textContent = 'Латиница, цифры, _, от 5 до 32 символов'; hint.classList.remove('error'); return; }
  if (!/^[a-zA-Z][a-zA-Z0-9_]{4,31}$/.test(v)) {
    inp.classList.add('invalid'); hint.textContent = 'Неверный формат'; hint.classList.add('error');
  } else {
    inp.classList.remove('invalid'); hint.textContent = 'OK'; hint.classList.remove('error');
  }
});

$('registerBtn').addEventListener('click', async () => {
  const username = $('regUsername').value.trim();
  const password = $('regPassword').value;
  const password2 = $('regPassword2').value;
  const err = $('registerError');
  err.textContent = '';

  if (!/^[a-zA-Z][a-zA-Z0-9_]{4,31}$/.test(username)) { err.textContent = 'Неверный формат юзернейма'; return; }
  if (password.length < 6) { err.textContent = 'Пароль минимум 6 символов'; return; }
  if (password !== password2) { err.textContent = 'Пароли не совпадают'; return; }

  const btn = $('registerBtn'); btn.disabled = true;
  try {
    const data = await api('/api/auth/register', { method: 'POST', body: JSON.stringify({ username, password }) });
    state.token = data.token;
    state.me = data.user;
    localStorage.setItem('zkg_token', data.token);
    $('login').classList.remove('active');
    $('onboarding').classList.add('active');
    setTimeout(() => $('onbName').focus(), 100);
  } catch (e) {
    err.textContent = e.message === 'username taken' ? 'Юзернейм занят' : e.message;
  } finally { btn.disabled = false; }
});

// ==== ОНБОРДИНГ ====
$('onbBio').addEventListener('input', (e) => {
  $('onbBioCount').textContent = `${e.target.value.length} / 120`;
});

$('onbSubmit').addEventListener('click', async () => {
  const name = $('onbName').value.trim();
  const bio = $('onbBio').value.trim();
  const err = $('onbError');
  err.textContent = '';
  if (name.length < 2) { err.textContent = 'Минимум 2 символа'; return; }

  const btn = $('onbSubmit'); btn.disabled = true;
  try {
    const data = await api('/api/profile', { method: 'POST', body: JSON.stringify({ name, bio }) });
    state.me = data.user;
    $('onboarding').classList.remove('active');
    await bootApp();
  } catch (e) {
    err.textContent = e.message;
  } finally { btn.disabled = false; }
});

// ==== СТАРТ ====
async function bootApp() {
  $('app').classList.add('active');
  renderProfile();
  await refreshChats();
  connectWS();
}

// ==== WS ====
function connectWS() {
  if (state.ws) try { state.ws.close(); } catch {}
  const ws = new WebSocket(WS_URL);
  state.ws = ws;

  ws.addEventListener('open', () => {
    ws.send(JSON.stringify({ type: 'auth', token: state.token, chatId: state.activeChatId || null }));
  });

  ws.addEventListener('message', (ev) => {
    let msg; try { msg = JSON.parse(ev.data); } catch { return; }
    if (msg.type === 'message') {
      const chat = state.chats.find(c => c.id === msg.chatId);
      if (!chat) { refreshChats(); return; }
      chat.messages.push({
        id: msg.message.id,
        userId: msg.message.userId,
        author: msg.user ? msg.user.name : '',
        text: msg.message.text,
        ts: msg.message.ts,
        out: msg.message.userId === state.me.id,
      });
      chat.last = msg.message;
      if (state.activeChatId === msg.chatId) renderMessages();
      renderChatList($('searchInput').value);
    }
  });

  ws.addEventListener('close', () => {
    setTimeout(() => { if (state.token) connectWS(); }, 3000);
  });
}

function wsSend(p) {
  if (state.ws && state.ws.readyState === 1) state.ws.send(JSON.stringify(p));
}

// ==== ЧАТЫ ====
async function refreshChats() {
  try {
    const data = await api('/api/chats');
    state.chats = data.chats.map(c => ({
      id: c.id, name: c.name, last: c.last,
      messages: [], loaded: false, memberInfo: c.memberInfo || null,
    }));
    renderChatList();
  } catch (e) { console.error('refreshChats', e); }
}

function chatDisplayName(c) {
  if (c.id === 'global') return c.name || 'Общий чат';
  if (c.name) return c.name;
  if (c.memberInfo) return c.memberInfo.name || c.memberInfo.username;
  return 'Чат';
}
function chatAvatar(c) {
  if (c.id === 'global') return { letter: 'О', color: '#5288c1' };
  if (c.memberInfo) return { letter: initials(c.memberInfo.name || c.memberInfo.username), color: c.memberInfo.color || '#5288c1' };
  return { letter: initials(chatDisplayName(c)), color: '#5288c1' };
}
function renderAvatar(c, size = 54) {
  const a = chatAvatar(c);
  const inner = a.letter === 'star' ? STAR_SVG : escapeHtml(a.letter);
  return `<div class="avatar" style="background:${a.color};width:${size}px;height:${size}px;font-size:${Math.round(size*0.41)}px">${inner}</div>`;
}

function renderChatList(filter = '') {
  const list = $('chatList');
  list.innerHTML = '';
  const q = filter.trim().toLowerCase();

  const matchedChats = state.chats.filter(c => !q || chatDisplayName(c).toLowerCase().includes(q));

  if (q && matchedChats.length) {
    const sec = document.createElement('div');
    sec.className = 'search-result-section';
    sec.textContent = 'Чаты';
    list.appendChild(sec);
  }

  matchedChats.forEach(chat => {
    const timeStr = chat.last ? formatTime(chat.last.ts) : '';
    const preview = chat.last ? chat.last.text : 'Нет сообщений';
    const el = document.createElement('div');
    el.className = 'chat-item' + (chat.id === state.activeChatId ? ' active' : '');
    el.innerHTML = `
      ${renderAvatar(chat)}
      <div class="chat-info">
        <div class="chat-row1">
          <div class="chat-name">${escapeHtml(chatDisplayName(chat))}</div>
          <div class="chat-time">${timeStr}</div>
        </div>
        <div class="chat-row2">
          <div class="chat-preview">${escapeHtml(preview)}</div>
        </div>
      </div>`;
    el.addEventListener('click', () => openChat(chat.id));
    list.appendChild(el);
  });

  if (q) {
    api('/api/users?q=' + encodeURIComponent(q)).then(data => {
      const found = data.users.filter(u => u.id !== state.me.id);
      if (!found.length) return;
      const sec = document.createElement('div');
      sec.className = 'search-result-section';
      sec.textContent = 'Люди';
      list.appendChild(sec);
      found.forEach(u => {
        const el = document.createElement('div');
        el.className = 'chat-item';
        el.innerHTML = `
          <div class="avatar" style="background:${u.color || '#5288c1'}">${escapeHtml(initials(u.name || u.username))}</div>
          <div class="chat-info">
            <div class="chat-row1"><div class="chat-name">${escapeHtml(u.name || u.username)}</div></div>
            <div class="chat-row2"><div class="chat-username">@${escapeHtml(u.username)}</div></div>
          </div>`;
        el.addEventListener('click', () => startDialogWith(u));
        list.appendChild(el);
      });
    }).catch(e => console.error('users search', e));
  }
}

$('searchInput').addEventListener('input', (e) => renderChatList(e.target.value));

async function startDialogWith(user) {
  try {
    const data = await api('/api/dialog', { method: 'POST', body: JSON.stringify({ userId: user.id }) });
    const chatId = data.chat.id;
    if (!state.chats.find(c => c.id === chatId)) {
      state.chats.push({ id: chatId, name: null, last: null, messages: [], loaded: false, memberInfo: data.chat.memberInfo || user });
    }
    $('searchInput').value = '';
    renderChatList();
    openChat(chatId);
  } catch (e) { alert('Не удалось открыть чат: ' + e.message); }
}

async function openChat(id) {
  state.activeChatId = id;
  const chat = state.chats.find(c => c.id === id);
  if (!chat) return;

  $('emptyState').style.display = 'none';
  $('chatContent').style.display = 'flex';

  const a = chatAvatar(chat);
  $('chatHeaderAvatar').style.background = a.color;
  $('chatHeaderAvatar').innerHTML = a.letter === 'star'
    ? STAR_SVG.replace('width="26" height="26"', 'width="20" height="20"')
    : escapeHtml(a.letter);

  $('chatHeaderName').textContent = chatDisplayName(chat);
  $('chatHeaderStatus').textContent = chat.memberInfo ? '@' + chat.memberInfo.username : 'Общий чат';

  if (!chat.loaded) {
    try {
      const data = await api('/api/chats/' + encodeURIComponent(id) + '/messages');
      chat.messages = data.messages.map(m => ({
        id: m.id, userId: m.userId,
        author: m.user ? m.user.name : '',
        text: m.text, ts: m.ts, out: m.userId === state.me.id,
      }));
      chat.loaded = true;
    } catch (e) { console.error(e); }
  }

  renderMessages();
  renderChatList($('searchInput').value);
  wsSend({ type: 'switch_chat', chatId: id });
  $('app').classList.add('chat-open');
  setTimeout(() => $('msgInput').focus(), 50);
}

function renderMessages() {
  const chat = state.chats.find(c => c.id === state.activeChatId);
  const box = $('messages');
  box.innerHTML = '';
  if (!chat) return;

  chat.messages.forEach(m => {
    const el = document.createElement('div');
    el.className = 'msg ' + (m.out ? 'out' : 'in');
    const isGroup = chat.id === 'global';
    const authorHtml = !m.out && isGroup && m.author ? `<div class="author">${escapeHtml(m.author)}</div>` : '';
    el.innerHTML = `${authorHtml}<span class="text">${escapeHtml(m.text)}</span><span class="meta">${formatTime(m.ts)}${m.out ? ' ✓✓' : ''}</span>`;
    box.appendChild(el);
  });
  box.scrollTop = box.scrollHeight;
}

$('backBtn').addEventListener('click', () => $('app').classList.remove('chat-open'));

const input = $('msgInput');
function autoResize() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 120) + 'px'; }
input.addEventListener('input', autoResize);
input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
$('sendBtn').addEventListener('click', sendMessage);

function sendMessage() {
  const text = input.value.trim();
  if (!text || !state.activeChatId) return;
  wsSend({ type: 'message', text });
  input.value = ''; autoResize(); input.focus();
}

function renderProfile() {
  if (!state.me) return;
  $('profileAvatar').textContent = initials(state.me.name || state.me.username);
  $('profileName').textContent = state.me.name || '—';
  $('profileUsername').textContent = '@' + (state.me.username || '—');
  const bioEl = $('profileBio');
  if (state.me.bio) { bioEl.textContent = state.me.bio; bioEl.classList.remove('empty'); }
  else { bioEl.textContent = 'Описание не указано'; bioEl.classList.add('empty'); }
}

document.querySelectorAll('.nav-item').forEach(item => {
  item.addEventListener('click', () => {
    const tab = item.dataset.tab;
    if (tab === state.currentTab) return;
    state.currentTab = tab;
    document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.tab === tab));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    if (tab === 'chats') $('tabChats').classList.add('active');
    if (tab === 'settings') $('tabSettings').classList.add('active');
    if (tab === 'profile') { $('tabProfile').classList.add('active'); renderProfile(); }
    if (tab !== 'chats') $('app').classList.remove('chat-open');
  });
});

$('logoutItem').addEventListener('click', () => {
  localStorage.removeItem('zkg_token');
  location.reload();
});

// ==== ВОССТАНОВЛЕНИЕ СЕССИИ ====
(async () => {
  const saved = localStorage.getItem('zkg_token');
  if (!saved) return;
  state.token = saved;
  try {
    const data = await api('/api/me');
    state.me = data.user;
    if (!state.me.name) {
      $('login').classList.remove('active');
      $('onboarding').classList.add('active');
    } else {
      $('login').classList.remove('active');
      await bootApp();
    }
  } catch (e) {
    localStorage.removeItem('zkg_token');
    state.token = null;
  }
})();
</script>
</body>
</html>
